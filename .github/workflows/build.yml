name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Testy
        run: dotnet test -c Release

      - name: Publikacja win-x64
        run: dotnet publish src/Wycenka.App -c Release -r win-x64 -o artifacts/win-x64

      - name: Publikacja win-arm64
        run: dotnet publish src/Wycenka.App -c Release -r win-arm64 -o artifacts/win-arm64

      - name: Nazwy plików
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item artifacts/win-x64/Wycenka.exe dist/Wycenka-win-x64.exe
          Copy-Item artifacts/win-arm64/Wycenka.exe dist/Wycenka-win-arm64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: Wycenka
          path: dist/*.exe

      - name: Wydanie
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
